[project]
name = "ieducar-moodle-publicador"
version = "1.2.0"
description = "Aplica no Moodle os comandos da integração, de forma idempotente"
readme = "README.md"
authors = [
    { name = "Francisco Rotilli", email = "francisco.r@edu.pucrs.br" },
    { name = "Nícolas Durgante Vargas", email = "nicolas.v02@edu.pucrs.br" }
]
requires-python = ">=3.14"
dependencies = ["aio-pika>=9.5", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28.1", "prometheus-client>=0.21", "pydantic>=2.10", "tenacity>=9.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["anyio>=4", "pytest>=9.1.1", "ruff>=0.16.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["publicador"]
